<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
<title id="title">grep/glob concurrency declaration flow</title>
<desc id="desc">The plugin gets the original grep/glob definition objects and sets isConcurrencySafe. The scheduler classifies before execute; an edit/bash call still breaks the parallel group. Not a screenshot.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m0 0 7 4-7 4" fill="none" stroke="#6a8990" stroke-width="1.5"/></marker></defs>
<rect width="600" height="720" rx="22" fill="#f4f8f8"/>
<g font-family="sans-serif">
<text x="40" y="52" font-size="28" font-weight="700" fill="#173a40">Declare only, keep execute</text>
<text x="40" y="86" font-size="18" fill="#4d6b72">Schematic · not a custom scheduler</text>
<g fill="white" stroke="#c5ddd8">
<rect x="40" y="120" width="520" height="96" rx="16"/>
<rect x="40" y="250" width="520" height="96" rx="16"/>
<rect x="40" y="380" width="520" height="96" rx="16"/>
<rect x="40" y="510" width="520" height="96" rx="16"/>
</g>
<g fill="#1c6d60" font-size="22" font-weight="700"><text x="60" y="158">01</text><text x="60" y="288">02</text><text x="60" y="418">03</text><text x="60" y="548">04</text></g>
<g fill="#183c42" font-size="22" font-weight="600">
<text x="104" y="158">Resolve original grep / glob</text>
<text x="104" y="288">Set isConcurrencySafe = true</text>
<text x="104" y="418">Scheduler classifies definitions</text>
<text x="104" y="548">edit / bash stay exclusive</text>
</g>
<g fill="#516e73" font-size="18">
<text x="104" y="190">Global get, or after agent/created</text>
<text x="104" y="320">Same object; no execute rewrite</text>
<text x="104" y="450">Exact true is parallel; spill uses callId</text>
<text x="104" y="580">A write tool drains the pool as a barrier</text>
</g>
<g stroke="#6a8990" stroke-width="2" marker-end="url(#arrow)">
<path d="M300 220v23"/><path d="M300 350v23"/><path d="M300 480v23"/>
</g>
<rect x="40" y="638" width="520" height="54" rx="12" fill="#e3eee9"/>
<text x="60" y="672" font-size="19" font-weight="600" fill="#235b50">Uninstall: remove only this insert from the desktop patch</text>
</g>
</svg>
